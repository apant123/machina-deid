[project]
name = "machina-deid"
version = "0.1.0"
description = "De-identification pipeline for engineering/CAD data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "pyarrow>=17",
    "olefile>=0.47",
    "pymupdf>=1.24",
    "pyyaml>=6",
    "tqdm>=4.66",
    "ncompress>=1.0.2",
    "zopfli>=0.4.3",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "duckdb>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
